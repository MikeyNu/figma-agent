name: Unpack validated Figma skill bundle

on:
  push:
    paths:
      - '.bundle/**'
      - '.github/workflows/unpack-skill-bundle.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct, extract, and publish
        shell: bash
        run: |
          set -euxo pipefail
          cat .bundle/part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/figma-agent-skill.tar.gz
          echo "654d0135af513e82a4184fbcfd13970612e3738965cedda0012ec8f4b908b094  /tmp/figma-agent-skill.tar.gz" | sha256sum -c -
          tmp="$(mktemp -d)"
          tar -xzf /tmp/figma-agent-skill.tar.gz -C "$tmp"
          cp -a "$tmp/figma-agent-skill/." .
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .bundle
          rm -f .github/workflows/unpack-skill-bundle.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "figma-agent-bootstrap"
          git config user.email "figma-agent-bootstrap@users.noreply.github.com"
          git add -A
          git commit -m "Add production-grade Figma reverse-engineering skill"
          git push origin HEAD:main
